profile: deutsche-bahn

defaults:
  overwrite: false

fields:
  order_number:
    stages:
      - target: metadata
        metadata_key: keywords
        regex: "ticket-number=(\\d+)"
        group: 1
      - regex: "Auftragsnummer:\\s*(\\d+)"
        group: 1

  purchase_date:
    type: date
    output_format: yyyy-MM-dd
    stages:
      - target: metadata
        metadata_key: keywords
        regex: "purchase-date=(\\d{4}-\\d{2}-\\d{2})"
        group: 1
        input_format: yyyy-MM-dd
      - regex: "(?s)(\\d{2}\\.\\d{2}\\.\\d{2})\\s+Fahrkarte\\b.*?[0-9]+,[0-9]{2}\\s*€\\s+\\d{2}\\.\\d{2}\\.\\d{2}"
        group: 1
        input_format: dd.MM.yy

  start_date:
    type: date
    output_format: yyyy-MM-dd
    stages:
      - target: metadata
        metadata_key: keywords
        regex: "trip-start-date=(\\d{4}-\\d{2}-\\d{2})"
        group: 1
        input_format: yyyy-MM-dd
      - regex: "(?s)\\d{2}\\.\\d{2}\\.\\d{2}\\s+Fahrkarte\\b.*?[0-9]+,[0-9]{2}\\s*€\\s+(\\d{2}\\.\\d{2}\\.\\d{2})"
        group: 1
        input_format: dd.MM.yy

  end_date:
    type: date
    output_format: yyyy-MM-dd
    stages:
      - target: metadata
        metadata_key: keywords
        regex: "trip-end-date=(\\d{4}-\\d{2}-\\d{2})"
        group: 1
        input_format: yyyy-MM-dd
      - regex: "(?s)\\d{2}\\.\\d{2}\\.\\d{2}\\s+Fahrkarte\\b.*?[0-9]+,[0-9]{2}\\s*€\\s+(\\d{2}\\.\\d{2}\\.\\d{2})"
        group: 1
        input_format: dd.MM.yy

  invoice_date:
    type: date
    output_format: yyyy-MM-dd
    stages:
      - target: metadata
        metadata_key: keywords
        regex: "invoice-date=(\\d{4}-\\d{2}-\\d{2})"
        group: 1
        input_format: yyyy-MM-dd
      - regex: "Rechnungsdatum:\\s*(\\d{2}\\.\\d{2}\\.\\d{4})"
        group: 1
        input_format: dd.MM.yyyy

  cost:
    regex: "(?s)Summe \\(brutto\\)\\s*([0-9]+,[0-9]{2}\\s*€)"
    group: 1

static:
  expense_type: "Mobilität"
  issuer: "Deutsche Bahn"
  tags:
    - expense
    - work

markdown_filename: "{{purchase_date}} Bahnticket {{order_number}}"
pdf_filename: "{{invoice_date}} Bahnticket {{order_number}}"

markdown: |
  ---
  name: Bahnticket {{order_number}}
  receipt: "[[{{pdf_basename}}.pdf]]"
  cost: {{cost}}
  date: {{purchase_date}}
  expense-type: {{expense_type}}
  issuer: {{issuer}}
  start: {{start_date}}
  end: {{end_date}}
  tags:
  {% for tag in tags %}  - {{tag}}
  {% endfor %}
  ---
