profile: deutsche-bahn

defaults:
  overwrite: false

fields:
  order_number:
    regex: "Auftragsnummer:\\s*(\\d+)"
    group: 1

  booking_date:
    regex: "(?s)(\\d{2}\\.\\d{2}\\.\\d{2})\\s+Fahrkarte\\b.*?[0-9]+,[0-9]{2}\\s*€\\s+\\d{2}\\.\\d{2}\\.\\d{2}"
    group: 1
    type: date
    input_format: dd.MM.yy
    output_format: yyyy-MM-dd

  service_date:
    regex: "(?s)\\d{2}\\.\\d{2}\\.\\d{2}\\s+Fahrkarte\\b.*?[0-9]+,[0-9]{2}\\s*€\\s+(\\d{2}\\.\\d{2}\\.\\d{2})"
    group: 1
    type: date
    input_format: dd.MM.yy
    output_format: yyyy-MM-dd

  cost:
    regex: "(?s)Summe \\(brutto\\)\\s*([0-9]+,[0-9]{2}\\s*€)"
    group: 1

static:
  expense_type: "Mobilität"
  issuer: "Deutsche Bahn"
  tags:
    - expense
    - work

filename: "{{booking_date}} Bahnticket {{order_number}}"

markdown: |
  ---
  name: Bahnticket {{order_number}}
  receipt: "[[{{basename}}.pdf]]"
  cost: {{cost}}
  date: {{booking_date}}
  expense-type: {{expense_type}}
  issuer: {{issuer}}
  start: {{service_date}}
  end: {{service_date}}
  tags:
  {% for tag in tags %}  - {{tag}}
  {% endfor %}
  ---
