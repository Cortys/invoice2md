profile: openai

defaults:
  overwrite: false

fields:
  name:
    regex: "(?m)^Description\\s+Qty\\s+Unit price\\s+Tax\\s+Amount\\s*\\r?\\n([^\\r\\n]+?)(?:[ \\t]+\\(per seat\\))?[ \\t]*$"
    group: 1

  invoice_date:
    type: date
    output_format: yyyy-MM-dd
    regex: "Date of issue\\s+([A-Za-z]+\\s+\\d{1,2},\\s+\\d{4})"
    group: 1
    input_format: MMMM d, yyyy
    input_locale: en-US

  cost:
    regex: "(?m)^Total\\s+€([0-9]+(?:,[0-9]{3})*\\.[0-9]{2})"
    group: 1

static:
  expense_type: "Software"
  issuer: "OpenAI"
  tags:
    - expense
    - work

markdown_filename: "{{invoice_date}} {{name}}"
pdf_filename: "{{invoice_date}} {{name}}"

markdown: |
  ---
  name: {{name}}
  receipt: "[[{{pdf_basename}}.pdf]]"
  cost: {{cost}} €
  taxable-cost: "0 €"
  date: {{invoice_date}}
  expense-type: {{expense_type}}
  issuer: {{issuer}}
  tags:
  {% for tag in tags %}  - {{tag}}
  {% endfor %}
  ---
