profile: 2-rent

defaults:
  overwrite: false

fields:
  invoice_date:
    type: date
    output_format: yyyy-MM-dd
    regex: "Datum:\\s+(\\d{2}/\\d{2}/\\d{4})"
    group: 1
    input_format: dd/MM/yyyy

  start_date:
    type: date
    output_format: yyyy-MM-dd
    regex: "Anreise:\\s+(\\d{2}/\\d{2}/\\d{4})"
    group: 1
    input_format: dd/MM/yyyy

  end_date:
    type: date
    output_format: yyyy-MM-dd
    regex: "Abreise:\\s+(\\d{2}/\\d{2}/\\d{4})"
    group: 1
    input_format: dd/MM/yyyy

  cost:
    regex: "Brutto\\s+([0-9]+,[0-9]{2})\\s*€"
    group: 1

  street_prefix:
    regex: "(?m)^([A-Za-zÄÖÜäöüß]{3})[A-Za-zÄÖÜäöüß]*\\s+Stra(?:ß|ss)e\\s+[0-9]+(?:\\s+[A-Z])?,\\s+\\d{5}\\s+München"
    group: 1

  street_number:
    regex: "(?m)^[A-Za-zÄÖÜäöüß]+\\s+Stra(?:ß|ss)e\\s+([0-9]+(?:\\s+[A-Z])?),\\s+\\d{5}\\s+München"
    group: 1

static:
  expense_type: "Hotel"
  tags:
    - expense
    - work

markdown_filename: "{{invoice_date}} 2-Rent Group Hostel Apartments {{street_prefix|upper}}{{street_number|remove:\" \"}} Munich"
pdf_filename: "{{invoice_date}} 2-Rent Group Hostel Apartments {{street_prefix|upper}}{{street_number|remove:\" \"}} Munich"

markdown: |
  ---
  receipt: "[[{{pdf_basename}}.pdf]]"
  cost: {{cost}} €
  date: {{invoice_date}}
  start: {{start_date}}
  end: {{end_date}}
  expense-type: {{expense_type}}
  issuer: 2-Rent Group Hostel Apartments {{street_prefix|upper}}{{street_number|remove:" "}} Munich
  tags:
  {% for tag in tags %}  - {{tag}}
  {% endfor %}---
  - Booked on Booking.com
  - `=(date(this.end) - date(this.start)).days + " " + choice((date(this.end) - date(this.start)).days = 1, "night", "nights")`
