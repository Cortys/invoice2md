profile: ibis-budget

defaults:
  overwrite: false

fields:
  invoice_date:
    type: date
    output_format: yyyy-MM-dd
    regex: "Rechnungsnummer:\\s*\\d+\\s+Datum\\s+(\\d{2}\\.\\d{2}\\.\\d{4})"
    group: 1
    input_format: dd.MM.yyyy

  start_date:
    type: date
    output_format: yyyy-MM-dd
    regex: "Anreise\\s+(\\d{2}\\.\\d{2}\\.\\d{4})"
    group: 1
    input_format: dd.MM.yyyy

  end_date:
    type: date
    output_format: yyyy-MM-dd
    regex: "Abreise\\s+(\\d{2}\\.\\d{2}\\.\\d{4})"
    group: 1
    input_format: dd.MM.yyyy

  cost:
    regex: "(?m)^Total\\s+([0-9]+(?:[.,](?!00\\b)[0-9]{2})?)(?:[.,]00)?\\s+[0-9]+(?:[.,][0-9]{2})?"
    group: 1

static:
  expense_type: "Hotel"
  issuer: "ibis budget Muenchen City Sued"
  tags:
    - expense
    - work

markdown_filename: "{{invoice_date}} {{issuer}}"
pdf_filename: "{{invoice_date}} {{issuer}}"

markdown: |
  ---
  receipt: "[[{{pdf_basename}}.pdf]]"
  cost: {{cost}} €
  date: {{invoice_date}}
  start: {{start_date}}
  end: {{end_date}}
  expense-type: {{expense_type}}
  issuer: {{issuer}}
  tags:
  {% for tag in tags %}  - {{tag}}
  {% endfor %}---
  - Booked on Booking.com
  - `=(date(this.end) - date(this.start)).days + " " + choice((date(this.end) - date(this.start)).days = 1, "night", "nights")`
